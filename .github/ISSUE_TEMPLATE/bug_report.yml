name: Bug report
description: Report a reproducible issue without private controller information.
body:
  - type: markdown
    attributes:
      value: "Do not report vulnerabilities or credentials here. See SECURITY.md."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Jenkins, Java and plugin versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal sanitized reproduction
    validations:
      required: true
