RestOriginUnauthorized=REST 数据源地址尚未获管理员授权
RestOriginInvalid=REST 数据源地址无效或未获管理员授权
RestStatus=REST 数据源返回非成功状态
RestJson=REST 数据源必须返回 JSON
RestSize=REST 数据源响应超过 1 MiB
RestTimeout=REST 数据源响应过大或超时
RestArray=REST 数据源中找不到选项数组
RestRead=无法读取 REST 选项，请检查管理员授权、接口状态和 JSON 格式
CascadeContext=联动参数需要任务上下文和 REST 数据源
CascadeCycle=参数存在循环依赖或依赖层级过深
CascadePlaceholder=上级参数占位符只能用于 REST 查询参数
ParentInvalid=上级参数无效
ParentSensitive=不支持使用敏感或复杂参数作为上级参数
ParentLength=上级参数过长
ParentMissing=上级参数不存在或不支持联动
ParentUndeclared=REST 地址包含未声明的上级参数
DependenciesInvalid=上级参数名称无效，最多支持 8 个且不能依赖自身
SingleDefaults=单选参数不能配置多个默认值
ViewUnavailable=选项暂不可用，请检查数据源或默认值配置后重试
ParentsRequired=联动参数需要同时提供上级参数上下文
FormInvalid=参数表单格式无效
ParameterDuplicate=参数只能提交一次
FormRead=无法读取参数表单
CliBuildOnly=联动参数仅支持 build 命令
OriginFormat=每行仅填写协议、主机和端口，不包含路径或查询参数
OriginsInvalid=REST 地址授权格式无效
ParentsLength=上级参数数据过长
ParentsCount=上级参数过多
ParentsFormat=上级参数格式无效
OptionsUnavailable=选项暂不可用，请检查数据源配置后重试
DisplayName=Smart Select Parameter (可搜索单选/多选)
ChoicesRequired=请至少配置一个选项
