Name=Name
Mode=Selection mode
Multi=Multiple selection (MULTI)
Single=Single selection (SINGLE)
Choices=Choices
ChoicesHelp=One choice per line, or a string list in a Jenkinsfile. Choices must not contain commas.
DefaultValues=Default values
DefaultsHelp=Separate multiple defaults with commas. Use one value for single selection.
Options=Display labels and values
OptionsHelp=Optional JSON array of objects with value and label fields. Replaces ordinary choices; see the README for examples.
RestUrl=REST options URL
RestUrlHelp=Optional JSON source that replaces static choices. An administrator must approve its origin in system configuration.
ItemsPath=JSON array path
ItemsPathHelp=Leave empty for a root array, or use a dotted path such as data.items.
DependsOn=Parent parameters
DependsOnHelp=Optional comma-separated names. Use their placeholders only in REST query values; see the README. A parent change clears the selection and reloads options.
Token=Bearer token
TokenHelp=Optional. Stored encrypted by Jenkins and never sent to the build parameter page.
CacheSeconds=Cache seconds
CacheHelp=0 to 300 seconds; defaults to 30. Source failures block builds without falling back to static choices.
Searchable=Enable search
Description=Description
