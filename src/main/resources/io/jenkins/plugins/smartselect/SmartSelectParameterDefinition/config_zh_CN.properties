Name=参数名称
Mode=选择模式
Multi=多选 (MULTI)
Single=单选 (SINGLE)
Choices=选项列表
ChoicesHelp=每行一个选项；在 Jenkinsfile 中也可使用字符串数组。选项不允许包含逗号。
DefaultValues=默认选中项
DefaultsHelp=多个默认值使用英文逗号分隔；单选时只填写一个。
Options=展示名称与实际值
OptionsHelp=可选 JSON 数组，每个对象包含 value 和 label 字段，填写后替代普通选项，示例见 README。
RestUrl=REST 选项地址
RestUrlHelp=可选。填写后使用接口数据代替静态选项。接口必须返回 JSON 数组，且来源地址须在系统配置中获管理员授权。
ItemsPath=JSON 数组路径
ItemsPathHelp=根数组留空；对象中的数组可填写 data.items 等点分路径。
DependsOn=依赖的上级参数
DependsOnHelp=可选，多个名称用英文逗号分隔。REST 地址仅在问号后的查询值中填写对应占位符，详见 README 的联动示例。上级变化时会清空旧选择并重新读取。
Token=Bearer 令牌
TokenHelp=可选；由 Jenkins 加密保存，不会发送到构建参数页面。
CacheSeconds=缓存秒数
CacheHelp=0 到 300 秒；默认 30 秒。数据源失败时拒绝构建，不回退到静态选项。
Searchable=启用搜索
Description=描述
