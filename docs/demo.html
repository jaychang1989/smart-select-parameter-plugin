<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Select Parameter — local example</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../src/main/resources/io/jenkins/plugins/smartselect/smart-select.css">
<style>
body{margin:0;background:#f3f5f8;color:#1f2937;font:15px/1.6 system-ui,sans-serif}
main{max-width:680px;margin:48px auto;padding:32px 36px 210px;background:white;border:1px solid #dde3eb;border-radius:12px}
h1{font-size:26px;margin:0 0 5px}p{color:#637184;margin:0 0 26px}.field-label{display:block;font-weight:650;margin-bottom:9px}
footer{margin-top:20px;color:#637184;font-size:13px}code{color:#1d4ed8}
</style>
</head>
<body>
<main>
<h1>Smart Select Parameter</h1>
<p>Searchable single and multiple selection for Jenkins</p>
<span class="field-label">SERVICES</span>
<div class="smart-select-parameter" data-mode="MULTI">
<input type="hidden" name="name" value="SERVICES">
<input type="hidden" class="smart-select-value" name="value" value="price">
<div class="smart-select-widget">
<button type="button" class="smart-select-trigger" aria-haspopup="listbox" aria-expanded="false">
<span class="smart-select-summary"></span><span class="smart-select-chevron" aria-hidden="true">⌄</span>
</button>
<div class="smart-select-popup" hidden>
<div class="smart-select-search-wrap"><input type="search" class="smart-select-search" placeholder="Search choices" aria-label="Search choices"></div>
<div class="smart-select-toolbar"><span class="smart-select-count"></span><div>
<button type="button" class="smart-select-select-all">全选结果</button>
<button type="button" class="smart-select-clear">清空</button></div></div>
<div class="smart-select-options" role="listbox" aria-multiselectable="true">
<button type="button" class="smart-select-option" role="option" data-value="price"><span class="smart-select-indicator" aria-hidden="true"></span><span class="smart-select-label">Quote service</span></button>
<button type="button" class="smart-select-option" role="option" data-value="admin"><span class="smart-select-indicator" aria-hidden="true"></span><span class="smart-select-label">Administration service</span></button>
<button type="button" class="smart-select-option" role="option" data-value="billing"><span class="smart-select-indicator" aria-hidden="true"></span><span class="smart-select-label">Billing service</span></button>
<button type="button" class="smart-select-option" role="option" data-value="report"><span class="smart-select-indicator" aria-hidden="true"></span><span class="smart-select-label">Reporting service</span></button>
</div>
<div class="smart-select-pagination" hidden><button type="button" class="smart-select-previous">上一页</button><span class="smart-select-page-info"></span><button type="button" class="smart-select-next">下一页</button></div>
<div class="smart-select-empty" hidden>未找到匹配选项</div>
</div></div>
<div class="smart-select-error" role="status" aria-live="polite"></div>
</div>
<footer>Submitted value: <code id="selection">price</code><br>Local example only; no Jenkins controller is connected.</footer>
</main>
<script src="../src/main/resources/io/jenkins/plugins/smartselect/smart-select.js"></script>
<script>
const valueField=document.querySelector('.smart-select-value');
valueField.addEventListener('change',()=>{document.getElementById('selection').textContent=valueField.value;});
</script>
</body></html>
